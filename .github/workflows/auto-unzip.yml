name: Auto Unzip
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" && rm "$z"
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract APK project" || exit 0
          git push
          
